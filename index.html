<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance &amp; Investing Games</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f7f5; color: #1d2b24; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  h1 { color: #1f6f4a; }
  .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  button { font-size: 1.1rem; padding: 10px 20px; border: 0; border-radius: 8px; background: #1f6f4a; color: #fff; cursor: pointer; }
  #result { margin-top: 16px; font-size: 1.2rem; min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <h1>Finance &amp; Investing Games</h1>
  <p>Games are coming soon. If you can see this page, the site is working!</p>
  <div class="card">
    <p>Quick test: $1,000 invested at 7% a year. What's it worth after 10 years?</p>
    <button onclick="document.getElementById('result').textContent = '$' + (1000 * Math.pow(1.07, 10)).toFixed(2) + ' — that\'s compound interest!'">Show me</button>
    <div id="result"></div>
  </div>
</main>
</body>
</html>
