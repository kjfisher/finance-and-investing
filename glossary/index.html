es and the dollar.", "u": 8}, {"t": "Collectibles", "d": "Sneakers, cards, art: no income, hard to sell, fees and fakes.", "u": 8}, {"t": "Startup valuation", "d": "Investment ÷ stake. $500,000 for 20% → $2,500,000.", "u": 8}], NAMES={"1": "Financial Markets Overview", "2": "The Markets", "3": "Analyzing Companies", "4": "Investing in Funds", "5": "Bonds", "6": "Investment Theory & Portfolio Building", "7": "Derivatives", "8": "Crypto & Alternative Investments"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st={u:"all",q:"",mode:"list",defFirst:false,deck:[],i:0,flip:false,again:[]};
try{const s=JSON.parse(localStorage.getItem("fi-gloss")||"{}");if(s.u)st.u=s.u;if(s.mode)st.mode=s.mode;if(s.defFirst)st.defFirst=true}catch(e){}
const save=()=>{try{localStorage.setItem("fi-gloss",JSON.stringify({u:st.u,mode:st.mode,defFirst:st.defFirst}))}catch(e){}};
const F=document.getElementById("filters"),M=document.getElementById("main"),C=document.getElementById("count"),Q=document.getElementById("q");
F.innerHTML=[["all","All units"],...Object.keys(NAMES).map(n=>["u"+n,"Unit "+n])].map(([k,l])=>`<button data-u="${k}" aria-pressed="${k===st.u}">${l}</button>`).join("");
F.onclick=e=>{const b=e.target.closest("button");if(!b)return;st.u=b.dataset.u;F.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));save();newDeck();draw()};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function hits(){const q=norm(st.q.trim());return T.filter(t=>(st.u==="all"||"u"+t.u===st.u)&&(!q||norm(t.t+" "+t.d).includes(q))).sort((a,b)=>st.u==="all"&&!q?a.t.localeCompare(b.t):0)}
function hl(s){const q=st.q.trim();if(!q)return esc(s);const i=norm(s).indexOf(norm(q));return i<0?esc(s):esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length))}
function newDeck(){st.deck=hits().slice();for(let i=st.deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[st.deck[i],st.deck[j]]=[st.deck[j],st.deck[i]]}st.i=0;st.flip=false;st.again=[]}
function draw(){
 document.getElementById("mList").setAttribute("aria-pressed",st.mode==="list");document.getElementById("mCards").setAttribute("aria-pressed",st.mode==="cards");
 if(st.mode==="list"){const h=hits();C.textContent=h.length+" of "+T.length+" terms";
  M.innerHTML=h.length?`<div class="list">${h.map(t=>`<article class="term" style="--uc:var(--u${t.u})"><h3>${hl(t.t)} <span>Unit ${t.u} · ${esc(NAMES[t.u])}</span></h3><p>${hl(t.d)}</p></article>`).join("")}</div>`:`<p class="empty">No matches. Try a shorter word, or pick “All units”.</p>`;return}
 if(!st.deck.length){C.textContent="";M.innerHTML=`<p class="empty">No cards match. Clear the search or pick another unit.</p>`;return}
 if(st.i>=st.deck.length){const a=st.again.length;C.textContent="";M.innerHTML=`<div class="fc"><div class="card3" style="--uc:var(--accent)"><div><div class="big">Deck done!</div><p class="def">${a?`${a} card${a>1?"s":""} to practice again.`:"You knew every card."}</p></div></div><div class="fcbar">${a?`<button id="redo">Practice the ${a} again</button>`:""}<button id="restart">Shuffle all ${st.deck.length} again</button></div></div>`;
  const r=document.getElementById("redo");if(r)r.onclick=()=>{st.deck=st.again.slice();st.again=[];st.i=0;st.flip=false;draw()};document.getElementById("restart").onclick=()=>{st.deck=hits();newDeck();draw()};return}
 const t=st.deck[st.i],front=st.defFirst?["Definition",`<div class="def">${esc(t.d)}</div>`]:["Term",`<div class="big">${esc(t.t)}</div>`],back=st.defFirst?["Term",`<div class="big">${esc(t.t)}</div>`]:["Definition",`<div class="def">${esc(t.d)}</div>`],s=st.flip?back:front;
 C.textContent="";
 M.innerHTML=`<div class="fc"><div class="prog">Card ${st.i+1} of ${st.deck.length} · Unit ${t.u}</div>
<div class="card3" id="card" role="button" tabindex="0" aria-label="Flip card" style="--uc:var(--u${t.u})"><div><div class="side">${s[0]}${st.flip?"":" · tap to flip"}</div>${s[1]}</div></div>
<div class="fcbar">${st.flip?`<button class="again" id="again">↺ Practice again</button><button class="got" id="got">✓ Got it</button>`:`<button id="flip">Flip (space)</button>`}</div>
<label class="opt"><input type="checkbox" id="df" ${st.defFirst?"checked":""}> Show the definition first</label></div>`;
 const card=document.getElementById("card");card.onclick=flip;card.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();flip()}};
 const f=document.getElementById("flip");if(f)f.onclick=flip;
 const g=document.getElementById("got");if(g){g.onclick=()=>next(false);document.getElementById("again").onclick=()=>next(true)}
 document.getElementById("df").onchange=e=>{st.defFirst=e.target.checked;st.flip=false;save();draw()};
}
function flip(){st.flip=!st.flip;draw();const c=document.getElementById(st.flip?"got":"flip");if(c)c.focus()}
function next(a){if(a)st.again.push(st.deck[st.i]);st.i++;st.flip=false;draw();const c=document.getElementById("card");if(c)c.focus()}
document.addEventListener("keydown",e=>{if(st.mode!=="cards"||e.target===Q||e.target.type==="checkbox")return;if(e.key===" "){e.preventDefault();flip()}else if(st.flip&&e.key==="ArrowRight")next(false);else if(st.flip&&e.key==="ArrowLeft")next(true)});
document.getElementById("mList").onclick=()=>{st.mode="list";save();draw()};
document.getElementById("mCards").onclick=()=>{st.mode="cards";save();newDeck();draw()};
let tm;Q.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{st.q=Q.value;newDeck();draw()},120)};
const h=location.hash.slice(1);if(/^u[1-8]$/.test(h)){st.u=h;F.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.u===h))}
newDeck();draw();
</script></body></html>
