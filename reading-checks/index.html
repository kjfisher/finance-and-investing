    if(p.t==="n"){ const inp=card.querySelector(`input[data-k="${k}"]`), v=parseNum(inp.value); if(isNaN(v)){fb(k,"info","Type a number (like 1250 or 4.5).");return;}
      const ok=Math.abs(v-p.a)<=tol(p); first(k,ok);
      fb(k,ok?"ok":"no",ok?`<b>Correct: ${esc(fmtA(p))}.</b> ${esc(p.why||"")}`:`<b>Not yet.</b> Try again${(s.first[k]===false)?`, or <button class="btn" data-show="${k}">show the steps</button>`:""}.`);
      const sb=card.querySelector(`[data-show="${k}"]`); if(sb) sb.onclick=()=>fb(k,"info",`<b>Answer: ${esc(fmtA(p))}.</b> ${esc(p.why||"")}`); }
    else { const ta=card.querySelector(`textarea[data-k="${k}"]`); if(!ta.value.trim()){fb(k,"info","Write your answer first, then compare.");return;}
      s.done[k]=true; fb(k,"info",`<b>Sample answer:</b> ${esc(p.s)}<br><span style="color:var(--muted)">Did yours have the big idea? If not, add to it.</span>`); maybeResult(it); } });
  card.querySelectorAll(".opt[data-k]").forEach(b=>b.onclick=()=>{ const k=b.dataset.k,p=P(k),i=+b.dataset.i,ok=i===p.a; first(k,ok);
    if(ok){ card.querySelectorAll(`.opt[data-k="${k}"]`).forEach(x=>x.disabled=true); b.classList.add("ok"); fb(k,"ok",`<b>Correct.</b> ${esc(p.why||"")}`); }
    else { b.classList.add("no"); b.disabled=true; fb(k,"no","<b>Not yet.</b> Try another answer."); } });
  card.querySelectorAll("[data-conf]").forEach(b=>b.onclick=()=>{ s.conf=+b.dataset.conf; card.querySelectorAll("[data-conf]").forEach(x=>x.classList.toggle("ok",x===b)); maybeResult(it); });
  card.querySelectorAll("input[data-k]").forEach(inp=>inp.onkeydown=e=>{ if(e.key==="Enter") card.querySelector(`button.check[data-k="${inp.dataset.k}"]`).click(); });
}
function maybeResult(it){
  if(MODE==="warm") return; const s=st(it.d), ps=allParts(it), keys=ps.map((p,i)=>`${it.d}-${i}`);
  if(!keys.every(k=>s.done[k])||(MODE==="exit"&&s.conf==null)) return;
  const scored=keys.filter((k,i)=>ps[i].t!=="o"), right=scored.filter(k=>s.first[k]).length;
  document.getElementById("res-"+it.d).innerHTML=`<div class="result"><div class="tag">${MODE==="read"?"Reading check":"Show your teacher on the way out"} · Day ${it.d}</div>${scored.length?`<p class="big">${right}/${scored.length}</p><div>right on the first try</div>`:`<p class="big">✓</p><div>Done</div>`}${MODE==="exit"?`<div class="c">${esc(CONF[s.conf])}</div>`:`<div class="c">${right>=4?"Ready for class":"Reread the parts you missed"}</div>`}</div>`;
}
function render(){
  const main=document.getElementById("main"), m=/^#d(\d+)$/.exec(location.hash), intro=document.getElementById("intro"), fl=document.getElementById("filters");
  if(m&&DATA.some(x=>x.d===+m[1])){ const idx=DATA.findIndex(x=>x.d===+m[1]), it=DATA[idx]; intro.hidden=true; fl.hidden=true;
    main.innerHTML=cardHTML(it)+`<div class="pager" style="margin-top:16px">${idx>0?`<a class="btn" href="#d${DATA[idx-1].d}">← Day ${DATA[idx-1].d}</a>`:"<span></span>"}<a class="btn" href="#">All days</a>${idx<DATA.length-1?`<a class="btn" href="#d${DATA[idx+1].d}">Day ${DATA[idx+1].d} →</a>`:"<span></span>"}</div>`;
    wire(it); window.scrollTo(0,0); return; }
  intro.hidden=false; fl.hidden=false;
  fl.innerHTML=UNITS.filter(u=>u[0]==="all"||DATA.some(x=>x.u===u[0])).map(u=>`<button aria-pressed="${filter===u[0]}" data-f="${u[0]}">${u[1]}</button>`).join("");
  fl.querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.f; try{localStorage.setItem("fi-"+MODE+"-filter",filter);}catch(e){} render();});
  main.innerHTML=`<div class="list">${DATA.filter(x=>filter==="all"||x.u===filter).map(x=>`<a class="li" style="--uc:var(--${x.u})" href="#d${x.d}"><b>Day ${x.d}: ${esc(x.l)}</b><span>${x.p.length+(x.sp?1:0)} question${x.p.length+(x.sp?1:0)>1?"s":""}</span></a>`).join("")}</div>`;
}
addEventListener("hashchange",render); render();
</script></body></html>
