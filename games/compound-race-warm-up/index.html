,000 at 8% starting at 25", "$5,000 at 4% starting at 25", "$5,000 at 8% starting at 35", "$5,000 in a 0% account"], "a": 0, "why": "Higher rate AND more years: both feed compounding."}, {"k": "num", "q": "Inflation is **3%** a year. About how many years until prices double?", "a": 24, "u": "", "why": "Rule of 72 works for inflation too: 72 ÷ 3 = 24 years."}, {"k": "num", "q": "A card charges **18%** a year on an unpaid balance. About how many years until the debt doubles?", "a": 4, "u": "", "why": "72 ÷ 18 = 4. Compounding works against borrowers too."}], "story": {"title": "Zara and Theo's $3,000 head start", "text": ["Zara and Theo each got $3,000 from their grandmother. Zara invests hers at 20. Theo wants to wait until he's 29 and “has life figured out.”", "Who ends up ahead at 56, and by how much? The Rule of 72 can call it before a calculator does."]}, "unitName": "Unit 1: Financial Markets Overview", "color": "#2F7D46"};</script><script src="/arcade/arcade.js"></script><script src="/fm-home.js" defer></script><script src="/fm-calc.js" defer></script>
